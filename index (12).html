</html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Lesion Risk Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      color: #ff5733;
      font-size: 36px;
      padding-top: 30px;
      transition: color 0.5s ease;
    }
    h1:hover {
      color: #c70039;
    }
    p {
      font-size: 18px;
      color: #444;
      margin-bottom: 20px;
      transition: color 0.5s ease;
    }
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin-top: 50px;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease;
    }
    .container:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .upload-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }
    input[type="file"] {
      padding: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #ccc;
      margin-bottom: 20px;
      cursor: pointer;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    input[type="file"]:hover {
      border-color: #ff5733;
      transform: scale(1.05);
    }
    button {
      padding: 14px 35px;
      font-size: 18px;
      background-color: #ff5733;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    button:hover {
      background-color: #c70039;
      transform: scale(1.1);
    }
    #imagePreview {
      margin-top: 30px;
      max-width: 100%;
      height: auto;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      transition: transform 0.3s ease-in-out;
    }
    .result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 30px;
      padding: 20px;
      display: inline-block;
      border-radius: 10px;
      color: white;
      transition: all 0.3s ease;
    }
    .malignant {
      background-color: #ff4747;
      color: white;
    }
    .benign {
      background-color: #4caf50;
      color: white;
    }
    .risk-low {
      background-color: #4caf50;
    }
    .risk-high {
      background-color: #ff4747;
    }
    .result:hover {
      transform: scale(1.05);
    }
    .footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Skin Lesion Risk Detector</h1>
  <p>Upload an image of a skin lesion to preview and assess its risk.</p>

  <div class="container">
    <div class="upload-section">
      <input type="file" id="fileInput" accept="image/*" required>
      <button type="button" onclick="previewImage()">Upload & Preview Image</button>
    </div>
    <div id="imagePreview"></div>
    <div class="result" id="result"></div>
    <div class="result" id="riskResult"></div>
  </div>

  <div class="footer">
    <p>Created with ❤️ by Joshua Hickey</p>
  </div>

  <script>
    // Function to preview the uploaded image and simulate risk analysis
    function previewImage() {
      const fileInput = document.getElementById("fileInput");
      const resultDiv = document.getElementById("result");
      const imagePreview = document.getElementById("imagePreview");
      const riskDiv = document.getElementById("riskResult");

      if (fileInput.files.length === 0) {
        resultDiv.textContent = "Please upload an image first.";
        resultDiv.className = "result";
        riskDiv.textContent = "";
        riskDiv.className = "result";
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        // Create an image element to display the uploaded image
        const img = document.createElement("img");
        img.src = e.target.result;
        img.alt = "Uploaded Skin Lesion Image";
        img.style.maxWidth = "100%";
        img.style.borderRadius = "10px";

        imagePreview.innerHTML = ""; // Clear any previous images
        imagePreview.appendChild(img);

        // Simulate analyzing the image (replace with actual analysis logic)
        setTimeout(function() {
          const isMalignant = Math.random() > 0.5; // Random result for simulation
          resultDiv.textContent = isMalignant ? "Prediction: Malignant (Cancerous)" : "Prediction: Benign (Non-Cancerous)";
          resultDiv.className = isMalignant ? "result malignant" : "result benign";

          // Simulate risk level
          const isHighRisk = Math.random() > 0.5; // Random risk level for simulation
          riskDiv.textContent = isHighRisk ? "Risk: High (Seek immediate medical attention)" : "Risk: Low (No immediate concern)";
          riskDiv.className = isHighRisk ? "result risk-high" : "result risk-low";
        }, 1500);
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
